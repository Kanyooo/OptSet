[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uobench"
version = "0.1.0"
description = "Unified Optimization Benchmark with certified feasibility and diagnostics"
readme = "README.md"
authors = [
    {name = "OpenAI Codex"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib"
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
uobench = "uobench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uobench*"]
